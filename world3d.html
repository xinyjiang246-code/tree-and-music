<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界树 · 3D 地球</title>
<link rel="stylesheet" href="world3d.css">

<!-- 先定配色，避免首屏闪一下深色 -->
<script>
(function () {
  var q = new URLSearchParams(location.search).get('palette');
  var p = (q === 'paper' || q === 'night' || q === 'warm') ? q
    : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper');
  document.documentElement.dataset.palette = p;
})();
</script>


<!-- Three.js ES Module（import map，本地 vendor，离线可用） -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- 3D 画布容器 -->
<div id="stage"></div>
<div class="grain"></div>
<div class="vignette"></div>

<header class="top">
  <div class="brand">世界树</div>
  <div class="sub">每一棵拍下来的树，都落回它长着的地方</div>
</header>

<!-- 计数 -->
<div class="count" id="count">0 棵</div>

<!-- 状态提示 -->
<div class="status" id="status"></div>

<!-- 工具栏 -->
<div class="toolbar">
  <button class="ghost" id="pickBtn">放一棵树</button>
  <div class="loc">
    <input id="locSearch" type="text" placeholder="搜一个地名，把地球转过去">
    <button class="ghost tiny" id="locGo" disabled>去</button>
    <span class="loc-hint" id="locHint"></span>
  </div>
  <!-- 小飞机：带你去一个地方，或把一棵树寄到那里 -->
  <button class="plane-btn" id="planeBtn" aria-expanded="false" aria-controls="planePanel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12.1 21 3.4c.7-.3 1.4.4 1.1 1.1l-8.7 18.8c-.3.7-1.3.6-1.5-.1l-2.1-6.8-6.8-2.1c-.7-.2-.8-1.2-.1-1.5Z"/><path d="m9.8 16.4 11-13"/></svg>
    <span>小飞机</span>
    <span class="plane-badge" id="planeBadge">1</span>
  </button>
  <button class="ghost tiny danger" id="clearBtn">清空</button>
</div>

<!-- 小飞机面板 -->
<div class="plane-panel" id="planePanel" hidden>
  <div class="plane-head">
    <div>
      <div class="plane-title">小飞机</div>
      <div class="plane-sub" id="planeRule">每 12 小时有一次起飞机会</div>
    </div>
    <div class="plane-segs" role="group" aria-label="重置间隔">
      <button class="plane-seg on" data-reset="12">12 小时</button>
      <button class="plane-seg" data-reset="24">1 天</button>
    </div>
  </div>

  <div class="plane-field">
    <input id="planeDest" type="text" placeholder="想去哪儿？例如 曼谷 / 京都 / 冰岛" autocomplete="off" spellcheck="false">
    <div class="plane-suggest" id="planeSuggest" hidden></div>
  </div>

  <div class="plane-modes" role="group" aria-label="飞行方式">
    <button class="plane-mode on" data-mode="visit">去看看</button>
    <button class="plane-mode" data-mode="send">把树寄过去</button>
  </div>

  <div class="plane-send" id="planeSend" hidden>
    <select id="planeTree" aria-label="选择要寄走的树"></select>
  </div>

  <div class="plane-foot">
    <div class="plane-note" id="planeNote">只带你过去看看，树不动。</div>
    <button class="plane-go" id="planeGo" disabled>起飞</button>
  </div>
  <div class="plane-next" id="planeNext"></div>
</div>

<!-- 飞行动画层 -->
<div class="fly-layer" id="flyLayer" hidden aria-hidden="true">
  <svg class="fly-plane" id="flyPlane" viewBox="0 0 24 24"><path d="M2.2 12.1 21 3.4c.7-.3 1.4.4 1.1 1.1l-8.7 18.8c-.3.7-1.3.6-1.5-.1l-2.1-6.8-6.8-2.1c-.7-.2-.8-1.2-.1-1.5Z"/><path d="m9.8 16.4 11-13"/></svg>
  <div class="fly-trail" id="flyTrail"></div>
</div>

<!-- 树的卡片 -->
<aside class="card" id="card">
  <button class="card-close" id="cardClose" aria-label="关闭">×</button>
  <div class="card-body">
    <div class="card-img" id="cardImg" hidden></div>
    <div class="card-name" id="cardName"></div>
    <div class="card-tree" id="cardTree"></div>
    <div class="card-song" id="cardSong" hidden></div>
    <div class="card-visit" id="cardVisit"></div>
    <button class="card-grove-open" id="cardGroveOpen" aria-expanded="false" aria-controls="cardGrove">看这一丛</button>
    <div class="card-grove" id="cardGrove" hidden>
      <canvas id="groveCv"></canvas>
      <div class="card-grove-cap" id="groveCap"></div>
    </div>
    <div class="card-species" id="cardSpecies"></div>
    <div class="card-imagery" id="cardImagery"></div>
    <div class="card-flight" id="cardFlight" hidden></div>
    <div class="card-loc" id="cardLoc"></div>
    <div class="card-loc-src" id="cardLocSrc" hidden></div>
    <div class="card-loc-edit" id="cardLocEdit" hidden>
      <input id="cardLocInput" type="text" inputmode="text" placeholder="地名，或 13.75,100.50" aria-label="新的位置">
      <button id="cardLocSave" type="button">改到这里</button>
      <button id="cardLocCancel" type="button">取消</button>
      <div class="card-loc-hint" id="cardLocHint"></div>
    </div>
    <button class="card-loc-fix" id="cardLocFix" type="button">位置不对？改坐标</button>
    <div class="card-date" id="cardDate"></div>
    <button class="card-listen" id="cardListen">听这棵树 · 进入它的声音</button>
  </div>
</aside>

<input type="file" id="fileImg" accept="image/*" hidden>

<!-- 离线地域 → 树种（卡片的「这一带常见」就来自这里） -->
<script src="exif.js"></script>
<script src="data/species.js"></script>
<!-- 树形库 + 画法：卡片里的「这一丛」复用树页同一套形态与画法 -->
<script src="forms.js"></script>
<script src="tree-sample.js"></script>

<script type="module" src="world3d.js"></script>
</body>
</html>
